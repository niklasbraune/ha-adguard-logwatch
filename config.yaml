name: AdGuard Log Watch
slug: adguard_logwatch
version: "0.1.1"
description: Auswertung des AdGuard-Query-Logs mit Regeln und Pushover-Benachrichtigungen
url: "https://github.com/niklasbraune/ha-adguard-logwatch"
arch:
- aarch64
- amd64
- armhf
- armv7
- i386
startup: services
boot: auto
init: false
homeassistant_api: true
ingress: true
ingress_port: 8099
panel_admin: true
panel_icon: mdi:shield-search
map:
- data:rw
options:
  adguard_url: ""
  username: ""
  password: ""
  monitor_interval: 5
schema:
  adguard_url: str?
  username: str?
  password: password?
  monitor_interval: int(1,60)?
